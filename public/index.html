<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Drop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🎥 Video Drop</h1>
        <p class="subtitle">Upload and share large video files directly with no logins required.</p>
        
        <hr>

        <div class="upload-section">
            <h3>Upload a New Video</h3>
            <div class="file-input-wrapper">
                <input type="file" id="videoFile" accept="video/*">
            </div>
            <button id="uploadBtn">Start Upload</button>
            
            <div class="progress-container" id="progressContainer" style="display: none;">
                <div class="progress-bar-wrapper">
                    <div class="progress-bar" id="progressBar">0%</div>
                </div>
                <p id="progressStatus">Preparing upload...</p>
            </div>
        </div>

        <hr>

        <div class="list-section">
            <h3>Available Downloads</h3>
            <div id="videoList" class="video-list">
                <p class="loading-text">Loading videos...</p>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
